<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Car</title>
</head>
<body>
<table border="1">
    <thead>
    <tr>
        <th scope="col"> Number </th>
        <th scope="col"> Model </th>
        <th scope="col"> Years </th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="car : ${cars}">
        <td th:utext="${car.getId()}"></td>
        <td th:utext="${car.getModel()}"></td>
        <td th:utext="${car.getYear()}"></td>


    </tr>

    </tbody>
</table>

</body>
</html>
