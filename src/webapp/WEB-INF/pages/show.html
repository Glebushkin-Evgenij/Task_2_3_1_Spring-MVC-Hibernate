<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title> People </title>
</head>
<body>
<a th:text="${person.getName()}">VALUE</a>
<a th:text="${person.getLastName()}">VALUE</a>
<a th:text="${person.getYears()}">VALUE</a>
<br/>

<a th:href="@{/{id}/edit(id=${person.getId()})}">Edit</a>

<form th:method="DELETE" th:action="@{/{id}(id=${person.getId()})}" >
<input type="submit" value="Delete"/>

</form>


</body>
</html>
