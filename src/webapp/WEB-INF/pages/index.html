<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
</head>
<body>
<div th:each="person:${people}">
    <a th:href="@{/{id}(id=${person.getId()})}" th:text="${person.getName() +' '+ person.getLastName()+', '
                                                    + person.getYears()}">user</a>
</div>

<br/>
<hr/>

<a href="/new">Create new person</a>

</body>
</html>
