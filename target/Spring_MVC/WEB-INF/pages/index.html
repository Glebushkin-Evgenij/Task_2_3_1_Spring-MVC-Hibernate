<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
</head>
<body>
<div th:each="person:${people}">

    <a th:text="${person.getName() + ' ' + person.getLastName() + ', ' + person.getYears()}"></a>

    <a th:href="@{/?action=edit&id={id}(id=${person.getId()})}">Edit</a>

    <form th:action="@{/}" method="post" style="display:inline;">
        <input type="hidden" name="action" value="delete"/>
        <input type="hidden" name="id" th:value="${person.getId()}"/>
        <input type="submit" value="Delete"
               onclick="return confirm('Are you sure you want to delete this user?')"/>
    </form>
    <br/>
</div>

<br/>
<hr/>

<a th:href="@{/?action=new}">Create new person</a>

</body>
</html>
